services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: hindsight
    ports:
      - "8888:8888"
      - "9999:9999"
    environment:
      - HINDSIGHT_API_WORKER_ID=hindsight-local
      - HINDSIGHT_API_LLM_PROVIDER=groq
      - HINDSIGHT_API_LLM_API_KEY=${GROQ_API_KEY}
      - HINDSIGHT_API_LLM_MODEL=openai/gpt-oss-20b
      # Persistent fix: ensures Groq on-demand tier is used instead of unsupported "auto"
      - HINDSIGHT_API_LLM_GROQ_SERVICE_TIER=on_demand
      - HINDSIGHT_API_HOST=0.0.0.0
      - HINDSIGHT_API_PORT=8888
      - HINDSIGHT_CP_DATAPLANE_API_URL=http://localhost:8888
      - HINDSIGHT_ENABLE_API=true
      - HINDSIGHT_ENABLE_CP=true
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    restart: unless-stopped

volumes:
  hindsight-data:
    name: hindsight-data
